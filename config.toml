[plugin]
enabled = true
config_version = "0.2.3"

[auth]
api_key = ""
api_key_env = "DEEPSEEK_API_KEY"

[model]
model_choice = "deepseek-v4-flash"
max_tokens = 8192

[thinking]
thinking_mode = "enabled"
thinking_effort = "max"

[search]
enabled = true
web_search_tool = "web_search_20260209"
max_search_uses = 15
search_policy = "active"

[debug]
log_search_sources = true
log_raw_summary = false
enable_test_commands = true
