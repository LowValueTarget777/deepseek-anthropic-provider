[project]
name = "deepseek-anthropic-provider"
version = "0.3.0"
description = "MaiBot web tools for the official DeepSeek Search and Fetch APIs"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1,<1.0.0",
    "maibot-plugin-sdk>=2.5.2,<3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: 需要显式启用并会调用真实 DeepSeek API 的集成测试",
]
