[project]
name = "deepseek-anthropic-provider"
version = "0.1.0"
description = "MaiBot LLM Provider plugin for DeepSeek Anthropic-compatible API"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.104.0,<1.0.0",
    "maibot-plugin-sdk>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
