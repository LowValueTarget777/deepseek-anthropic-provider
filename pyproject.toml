[project]
name = "deepseek-anthropic-provider"
version = "0.2.0"
description = "MaiBot Tool plugin for DeepSeek Anthropic-compatible API"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.104.0,<1.0.0",
    "maibot-plugin-sdk>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
